<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MistaHub Developers</title>
  
  <!-- Tailwind CSS & Typography (For beautiful Markdown) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  
  <!-- Marked.js (Markdown to HTML converter) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Highlight.js (For coloring Code Blocks) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    /* Custom Scrollbar for Sidebar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    /* Prevent body scroll when mobile menu is open */
    body.menu-open { overflow: hidden; }
    /* Active menu item style */
    .active-menu { background-color: #eff6ff; color: #2563eb; font-weight: 600; border-right: 3px solid #2563eb; }
  </style>
</head>
<body class="bg-white text-gray-800 font-sans antialiased flex flex-col min-h-screen">

  <!-- Navbar (Fixed Top) -->
  <header class="fixed top-0 w-full bg-white/80 backdrop-blur-md border-b border-gray-200 z-50 h-16 flex items-center">
    <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <!-- Mobile Menu Button -->
        <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 text-gray-600 hover:text-blue-600">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <!-- Logo -->
        <h1 class="text-xl font-black text-blue-600 tracking-tight flex items-center gap-2">
          <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          MistaHub Docs
        </h1>
      </div>

      <!-- Search Bar -->
      <div class="hidden md:block relative w-72">
        <input type="text" placeholder="Search docs..." class="w-full bg-gray-50 border border-gray-200 rounded-lg py-1.5 px-4 pl-10 focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm transition-all">
        <svg class="absolute left-3 top-2 text-gray-400" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
    </div>
  </header>

  <!-- Main Layout container -->
  <div class="flex flex-1 pt-16 max-w-7xl mx-auto w-full">
    
    <!-- Sidebar / Drawer (Hidden on mobile, block on lg screens) -->
    <!-- Overlay for mobile -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>
    
    <aside id="sidebar" class="fixed inset-y-0 left-0 pt-16 w-64 bg-gray-50 border-r border-gray-200 transform -translate-x-full lg:translate-x-0 lg:static lg:block transition-transform duration-300 z-40 overflow-y-auto pb-10">
      <nav id="menu-container" class="p-4 space-y-1 text-sm text-gray-600">
        <!-- Menu Items will be injected here by JavaScript -->
      </nav>
    </aside>

    <!-- Content Area -->
    <main class="flex-1 w-full min-w-0 px-4 sm:px-8 py-8 lg:py-10">
      <div id="loader" class="hidden flex justify-center py-20">
        <svg class="animate-spin h-8 w-8 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      </div>
      
      <!-- Rendered Markdown will appear here. The 'prose' class makes it look like Stripe/GitHub docs -->
      <article id="content" class="prose prose-blue prose-slate max-w-4xl w-full mx-auto pb-20">
        <!-- Default Content (Shows if no #hash is in URL) -->
        <h1>Welcome to MistaHub</h1>
        <p>Select a topic from the sidebar to start reading.</p>
      </article>
    </main>

  </div>

  <script>
    // --- 1. SETTING UP THE MENU DATA ---
    // In future, you can fetch this from a 'menu.json' file
    const menuData = [
      { section: "Getting Started", items: [
        { title: "Introduction", path: "intro" },
        { title: "Authentication", path: "auth" }
      ]},
      { section: "Products", items: [
        { title: "Payment Gateway", path: "payment-gateway" },
        { title: "Temp Mail API", path: "temp-mail" }
      ]}
    ];

    // --- 2. RENDER SIDEBAR MENU ---
    function renderMenu() {
      const container = document.getElementById('menu-container');
      let html = '';
      
      menuData.forEach(group => {
        html += `<h4 class="font-bold text-gray-900 mt-6 mb-2 px-3 uppercase tracking-wider text-xs">${group.section}</h4>`;
        group.items.forEach(item => {
          // #path will change the URL to yourdomain.com/#payment-gateway
          html += `<a href="#${item.path}" id="menu-${item.path}" class="menu-item block px-3 py-2 rounded-md hover:bg-gray-100 transition-colors mb-1 text-gray-600">${item.title}</a>`;
        });
      });
      container.innerHTML = html;
    }

    // --- 3. FETCH AND RENDER MARKDOWN ---
    async function loadMarkdownFile(path) {
      const contentDiv = document.getElementById('content');
      const loader = document.getElementById('loader');
      
      // Highlight active menu
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active-menu'));
      const activeEl = document.getElementById(`menu-${path}`);
      if(activeEl) activeEl.classList.add('active-menu');

      contentDiv.style.display = 'none';
      loader.style.display = 'flex';

      try {
        // Here we fetch the .md file from a 'docs' folder
        const response = await fetch(`docs/${path}.md`);
        
        if (!response.ok) throw new Error('File not found');
        
        const markdownText = await response.text();
        
        // Convert Markdown to HTML
        contentDiv.innerHTML = marked.parse(markdownText);
        
        // Apply color to code blocks
        hljs.highlightAll();
        
      } catch (error) {
        contentDiv.innerHTML = `
          <h1>404 - Page Not Found</h1>
          <p>The documentation file <b>${path}.md</b> is missing. Please create it in the 'docs' folder.</p>
        `;
      }

      loader.style.display = 'none';
      contentDiv.style.display = 'block';

      // Close mobile menu after clicking
      if (window.innerWidth < 1024) toggleSidebar(true);
    }

    // --- 4. ROUTING LOGIC (Listen for URL changes) ---
    function handleRouting() {
      const hash = window.location.hash.substring(1); // Get text after '#'
      if (hash) {
        loadMarkdownFile(hash);
      }
    }

    // --- 5. MOBILE SIDEBAR TOGGLE ---
    function toggleSidebar(forceClose = false) {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      
      if (forceClose || !sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
        document.body.classList.remove('menu-open');
      } else {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
        document.body.classList.add('menu-open');
      }
    }

    // --- INITIALIZE APP ---
    window.addEventListener('hashchange', handleRouting);
    renderMenu();
    handleRouting(); // Check URL on first load
  </script>
</body>
</html>
